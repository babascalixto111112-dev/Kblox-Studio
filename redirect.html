<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBlox Studio — Autenticação</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0F1117;
            color: #E5EDF5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2A2D36;
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #8B94A4; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Redirecionando para o KBlox Studio...</h2>
    <p>Se o aplicativo não abrir automaticamente, feche esta aba e retorne ao app.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        if (code) {
            const redirectUrl = 'kblox-auth://callback?' + params.toString();
            window.location.href = redirectUrl;
        } else {
            document.querySelector('h2').textContent = 'Código de autorização não encontrado.';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
